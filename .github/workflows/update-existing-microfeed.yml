name: Update an existing microfeed
run-name: Update ${{ inputs.worker_name || vars.MICROFEED_WORKER_NAME || 'microfeed' }} from ${{ github.ref_name }}

# This workflow intentionally has no push, pull-request, or scheduled trigger.
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Existing microfeed Worker name (overrides the repository variable)
        required: false
        type: string
      cloudflare_account_id:
        description: Cloudflare account ID, required only when your login has multiple accounts
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.worker_name || vars.MICROFEED_WORKER_NAME || 'microfeed' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Authorize and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MICROFEED_WORKER_NAME: ${{ inputs.worker_name || vars.MICROFEED_WORKER_NAME }}
      MICROFEED_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id || vars.MICROFEED_CLOUDFLARE_ACCOUNT_ID }}
      MICROFEED_STATE_DIRECTORY: ${{ runner.temp }}/microfeed-state
      WRANGLER_SEND_METRICS: "false"
      XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            ~/.cache/node/corepack
          key: ${{ runner.os }}-${{ runner.arch }}-deploy-yarn-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-deploy-yarn-

      - name: Install dependencies
        id: install
        run: yarn install --immutable

      - name: Validate the deployment target
        shell: bash
        run: |
          if [[ -z "$MICROFEED_WORKER_NAME" ]]; then
            echo "::error::Enter the existing Worker name or set the MICROFEED_WORKER_NAME repository variable."
            exit 1
          fi
          if [[ ! "$MICROFEED_WORKER_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            echo "::error::Worker names must contain 1–63 ASCII letters, numbers, or hyphens, without a leading or trailing hyphen."
            exit 1
          fi
          echo "Deploying the selected ref $GITHUB_REF at commit $GITHUB_SHA."
          echo "Only authorize this run when you trust that ref and commit."

      - name: Authorize Cloudflare and connect the existing site
        shell: bash
        run: |
          args=(--device --worker "$MICROFEED_WORKER_NAME" --yes)
          if [[ -n "$MICROFEED_CLOUDFLARE_ACCOUNT_ID" ]]; then
            args+=(--account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID")
          fi
          yarn manage connect "${args[@]}"

      - name: Deploy
        shell: bash
        run: |
          args=(--device --yes)
          if [[ -n "$MICROFEED_CLOUDFLARE_ACCOUNT_ID" ]]; then
            args+=(--account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID")
          fi
          yarn manage deploy "${args[@]}"

      - name: Verify the deployment
        shell: bash
        run: |
          args=(--device)
          if [[ -n "$MICROFEED_CLOUDFLARE_ACCOUNT_ID" ]]; then
            args+=(--account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID")
          fi
          yarn manage status "${args[@]}"

      - name: Revoke the temporary Cloudflare authorization
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: yarn wrangler logout
