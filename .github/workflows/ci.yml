name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            ~/.cache/node/corepack
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-
      - name: Verify Yarn version
        run: yarn --version
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type-check
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Verify the Worker bundle
        run: yarn wrangler deploy --dry-run --strict --config dist/server/wrangler.json
      - name: Check documentation
        run: yarn docs:check
