name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type-check
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Verify the Worker bundle
        run: yarn wrangler deploy --dry-run --strict --config dist/server/wrangler.json
      - name: Check documentation
        run: yarn docs:check
