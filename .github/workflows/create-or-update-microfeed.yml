name: Create or update microfeed
run-name: ${{ inputs.operation == 'create' && 'Create' || 'Update' }} ${{ inputs.worker_name || vars.MICROFEED_WORKER_NAME || 'microfeed' }} from ${{ github.ref_name }}

# This workflow intentionally has no push, pull-request, or scheduled trigger.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a new instance or update an existing one
        required: true
        default: update
        type: choice
        options:
          - update
          - create
      worker_name:
        description: microfeed Worker name (overrides the repository variable)
        required: false
        type: string
      administrator_email:
        description: New instance only; overrides the repository variable or Cloudflare login email
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: microfeed-${{ github.repository }}-${{ inputs.worker_name || vars.MICROFEED_WORKER_NAME || 'microfeed' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Authorize and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MICROFEED_WORKER_NAME: ${{ inputs.worker_name || vars.MICROFEED_WORKER_NAME }}
      MICROFEED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MICROFEED_ADMINISTRATOR_EMAIL: ${{ inputs.administrator_email || vars.MICROFEED_ADMINISTRATOR_EMAIL }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          path: |
            .yarn/cache
            ~/.cache/node/corepack
          key: ${{ runner.os }}-${{ runner.arch }}-microfeed-yarn-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-microfeed-yarn-

      - name: Install dependencies
        id: install
        run: yarn install --immutable

      - name: Prepare ephemeral state directories
        shell: bash
        run: |
          state_directory="$RUNNER_TEMP/microfeed-state"
          wrangler_directory="$RUNNER_TEMP/wrangler-config"
          install -d -m 700 "$state_directory" "$wrangler_directory"
          echo "MICROFEED_STATE_DIRECTORY=$state_directory" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$wrangler_directory" >> "$GITHUB_ENV"

      - name: Validate the target
        shell: bash
        run: |
          if [[ -z "$MICROFEED_WORKER_NAME" ]]; then
            echo "::error::Enter the Worker name or set the MICROFEED_WORKER_NAME repository variable."
            exit 1
          fi
          if [[ -z "$MICROFEED_CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Create the CLOUDFLARE_ACCOUNT_ID Actions secret before deploying. It pins this workflow to one Cloudflare account."
            exit 1
          fi
          if [[ ! "$MICROFEED_WORKER_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            echo "::error::Worker names must contain 1–63 ASCII letters, numbers, or hyphens, without a leading or trailing hyphen."
            exit 1
          fi
          echo "Using the selected ref $GITHUB_REF at commit $GITHUB_SHA."
          echo "Only authorize this run when you trust that ref and commit."

      - name: Explain the device authorization risk
        shell: bash
        run: |
          warning="The Cloudflare verification URL and one-time code will be visible in this workflow log while they are valid. "
          warning+="Someone else could use the code first, which would cause this run to fail. "
          warning+="The CLOUDFLARE_ACCOUNT_ID secret pins the destination: authorization for a different account is rejected before any Cloudflare resources are changed, so this workflow cannot deploy to that other account."
          echo "::warning title=Public Cloudflare verification code::$warning"

      - name: Authorize Cloudflare and create a new instance
        if: ${{ inputs.operation == 'create' }}
        env:
          MICROFEED_ADMIN_PASSWORD: ${{ secrets.MICROFEED_ADMIN_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$MICROFEED_ADMIN_PASSWORD" ]]; then
            echo "::error::Create the MICROFEED_ADMIN_PASSWORD Actions secret before creating a new instance. It is the password for the microfeed dashboard, not a Cloudflare credential."
            exit 1
          fi
          resource_prefix="${MICROFEED_WORKER_NAME,,}"
          args=(
            --device
            --account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID"
            --project-name "$MICROFEED_WORKER_NAME"
            --d1-name "${resource_prefix}-db"
            --r2-name "${resource_prefix}-media"
            --admin-path admin
            --yes
            --no-open
            --admin-password "$MICROFEED_ADMIN_PASSWORD"
          )
          if [[ -n "$MICROFEED_ADMINISTRATOR_EMAIL" ]]; then
            args+=(--owner-email "$MICROFEED_ADMINISTRATOR_EMAIL")
          fi
          yarn manage init "${args[@]}"

      - name: Authorize Cloudflare and connect the existing site
        if: ${{ inputs.operation == 'update' }}
        shell: bash
        run: |
          args=(--device --account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID" --worker "$MICROFEED_WORKER_NAME" --yes)
          yarn manage connect "${args[@]}"

      - name: Deploy
        if: ${{ inputs.operation == 'update' }}
        shell: bash
        run: |
          args=(--device --account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID" --yes)
          yarn manage deploy "${args[@]}"

      - name: Verify the deployment and publish links
        shell: bash
        run: |
          args=(--device --account-id "$MICROFEED_CLOUDFLARE_ACCOUNT_ID")
          status_log="$RUNNER_TEMP/microfeed-status.log"
          yarn manage status "${args[@]}" 2>&1 | tee "$status_log"

          STATUS_LOG="$status_log" node --input-type=module <<'NODE'
          import {appendFileSync, readFileSync} from "node:fs";

          const output = readFileSync(process.env.STATUS_LOG, "utf8").replace(
            /\u001B\[[0-?]*[ -/]*[@-~]/gu,
            "",
          );
          const publicUrlMatch = output.match(
            /(?:Custom domain|Deployment) verified:\s+(https:\/\/\S+)/u,
          );
          const adminPathMatch = output.match(
            /(?:^|\n)[^\n]*(\/[^\s*]+\/)\*:\s+/u,
          );
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!publicUrlMatch || !summaryPath) {
            console.log(
              "::warning title=Deployment links unavailable::The deployment was verified, but its links could not be added to the job summary. Open this step to view the status output.",
            );
            process.exit(0);
          }

          const siteUrl = new URL(publicUrlMatch[1]);
          const summary = [
            "## microfeed deployment verified",
            "",
            `- **Site:** [${siteUrl.href}](${siteUrl.href})`,
          ];

          if (adminPathMatch) {
            const dashboardUrl = new URL(adminPathMatch[1], siteUrl);
            summary.push(
              `- **Admin dashboard:** [${dashboardUrl.href}](${dashboardUrl.href})`,
            );
          }

          summary.push("");
          appendFileSync(summaryPath, summary.join("\n"));
          NODE

      - name: Revoke the temporary Cloudflare authorization
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: yarn wrangler logout
